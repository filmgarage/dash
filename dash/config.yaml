name: DASH
version: "0.4.0"
slug: dash
description: Live Home Assistant dashboards for simple screens
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard
panel_title: DASH
panel_admin: true
homeassistant_api: true
ports:
  8092/tcp: 8092
ports_description:
  8092/tcp: Screens (dashboards for frames and tablets)
options:
  read_token: ""
  log_level: info
  allow_domains: []
  services: []
  read_services: []
schema:
  read_token: password
  log_level: list(debug|info|warning|error)
  allow_domains:
    - str
  services:
    - str
  read_services:
    - str
